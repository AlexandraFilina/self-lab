name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: self_lab_test
          POSTGRES_USER: self_lab_test
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U self_lab_test -d self_lab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      TEST_DATABASE_URL: postgresql://self_lab_test:ci_only_disposable_password@127.0.0.1:5432/self_lab_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Runtime versions
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npm run test:browser
      - run: npm run test:browser:dev
